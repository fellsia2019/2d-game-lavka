<!doctype html><html lang="ru"><meta charset="utf-8"><title>Контуры интерьерных слоёв</title><style>body{margin:0}svg{width:100vw;height:calc(100vh - 40px);display:block}header{height:40px;font:16px system-ui;display:flex;gap:12px;align-items:center}button{height:36px}</style><header><span id="point">1536×1024</span><button id="toggle">Контуры</button><select id="mask"></select></header><svg viewBox="0 0 1536 1024"><image width="1536" height="1024"/><g id="lines"></g></svg><script type="module">
import {MAIN_LAYERS,PREP_LAYERS} from '/src/hall-scene-layers.ts';
import {hallSceneHTML} from '/src/hall-scene.ts';
import {mountHallCanvases} from '/src/hall-canvas.ts';
import '/src/hall-scene.css';
const prep=new URLSearchParams(location.search).has('prep'),layers=prep?PREP_LAYERS:MAIN_LAYERS;
const plate=new URLSearchParams(location.search).get('source')==='empty'?'empty':'master';
document.querySelector('image').setAttribute('href',`/assets/hall-room-${prep?'prep':'main'}-${plate}.webp`);
const lines=document.querySelector('#lines'),select=document.querySelector('#mask');
select.innerHTML='<option value="">Все</option>'+layers.map(l=>`<option value="${l.id}">${l.id}</option>`).join('');
function draw(){lines.innerHTML=layers.filter(l=>!select.value||l.id===select.value).map(l=>`<path d="${l.path}" stroke="${l.kind==='goods'?'#ff009d':'#00e7ff'}" stroke-width="2" fill="none"/>`).join('');}
select.onchange=draw;draw();document.querySelector('#toggle').onclick=()=>lines.style.display=lines.style.display==='none'?'':'none';
document.querySelector('svg').addEventListener('pointermove',e=>{const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(e.currentTarget.getScreenCTM().inverse());document.querySelector('#point').textContent=`${p.x.toFixed(0)},${p.y.toFixed(0)}`;});
if(new URLSearchParams(location.search).has('composite')){
  const query=new URLSearchParams(location.search),step=Math.max(0,Math.min(14,Number(query.get('step')??14)));
  document.querySelector('svg').remove();document.querySelector('#mask').remove();document.querySelector('#toggle').remove();
  document.querySelector('#point').textContent=`Runtime Canvas · ${prep?'2':'1'} · ${step}/14`;
  const assembly=document.createElement('div');assembly.style.width='1536px';assembly.style.height='1024px';
  assembly.innerHTML=hallSceneHTML(Array.from({length:step},(_,i)=>`shop-s1-r${String(i+1).padStart(2,'0')}`),'/assets/',{counter:query.get('color')??'sea'},{view:prep?'hall-prep':'hall'});
  document.body.append(assembly);await mountHallCanvases(assembly);
}
</script></html>
